auth:
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  issuer: ${AUTH_ISSUER:auth-lava}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

gfm:
  key-store: file:${GFM_KEYSTORE_PATH:}
  key-store-password: ${GFM_KEYSTORE_PASSWORD:}
  trust-store: file:${GFM_TRUSTSTORE_PATH:}
  trust-store-password: ${GFM_TRUSTSTORE_PASSWORD:}
  client-id: ${GFM_CLIENT_ID:jKtlgBlmtxDtjDf6uMwJ08tVU6Za}
  eta-teams-base-url: ${GFM_ETA_TEAMS_BASE_URL:https://eta-teams.transport.mil}
  mps-kmis-base-url: ${GFM_MPS_KMIS_BASE_URL:https://mps-kmis.transport.mil}
  gfm-base-url: ${GFM_GFM_BASE_URL:https://gfm.transport.mil}
  retry-backoff: ${GFM_RETRY_BACKOFF:5s}
  detail-fetch-skip-limit: ${GFM_DETAIL_FETCH_SKIP_LIMIT:1000}

google-maps:
  api-key: ${GOOGLE_MAPS_API_KEY:}
  base-url: ${GOOGLE_MAPS_BASE_URL:https://routes.googleapis.com}
  retry-backoff: ${GOOGLE_MAPS_RETRY_BACKOFF:5s}

# Places API (New) - shares google-maps.api-key rather than its own; see GooglePlacesProperties' javadoc.
google-places:
  base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
  retry-backoff: ${GOOGLE_PLACES_RETRY_BACKOFF:5s}

logging:
  level:
    com.lava: ${LOG_LEVEL_COM_LAVA:info}
    org.jooq.tools.LoggerListener: ${LOG_LEVEL_JOOQ:warn}
    org.springframework: ${LOG_LEVEL_SPRING:warn}
    org.springframework.jndi: error
    root: ${LOG_LEVEL_ROOT:info}
  pattern:
    console: "%d{yyyy-MM-dd} %d{HH:mm:ss.SSS} | %clr(%.-1p) | %-30.30logger{30} | %X{traceId:-} %X{spanId:-} | %clr(%replace(%m){'[\n\r\t]', '_'}%n)"
  # Unset (local dev) keeps the human-readable pattern above; set to gelf/ecs/logstash in
  # containerized/prod environments to emit structured JSON to stdout instead - MDC entries
  # (including traceId/spanId) are automatically included as JSON fields in every structured format.
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:}

management:
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/metrics

pickup-match:
  time-window: ${PICKUP_MATCH_TIME_WINDOW:48h}
  max-distance-miles: ${PICKUP_MATCH_MAX_DISTANCE_MILES:500}
  arrival-buffer: ${PICKUP_MATCH_ARRIVAL_BUFFER:2h}

samsara:
  api-token: ${SAMSARA_API_TOKEN:}
  base-url: ${SAMSARA_BASE_URL:https://api.samsara.com}
  retry-backoff: ${SAMSARA_RETRY_BACKOFF:5s}

samsara-driver-duty-status-sync:
  cron: ${SAMSARA_DRIVER_DUTY_STATUS_SYNC_CRON:0 * * ? * *}

samsara-driver-sync:
  cron: ${SAMSARA_DRIVER_SYNC_CRON:0 */5 * ? * *}

samsara-location-sync:
  cron: ${SAMSARA_LOCATION_SYNC_CRON:0 * * ? * *}

samsara-vehicle-sync:
  cron: ${SAMSARA_VEHICLE_SYNC_CRON:0 */10 * ? * *}

samsara-trailer-sync:
  cron: ${SAMSARA_TRAILER_SYNC_CRON:0 */10 * ? * *}

samsara-vehicle-diagnostics-sync:
  cron: ${SAMSARA_VEHICLE_DIAGNOSTICS_SYNC_CRON:0 */2 * ? * *}

server:
  port: ${SERVER_PORT:8081}

shipment-sync:
  # Offset 5 minutes after vektor-sync's own */20 tick (below), not the same tick - shipmentSyncJob's last step,
  # pickupMatchStep, reads vektor_manifest, and the two jobs are independent Spring Batch executions with no
  # ordering guarantee between them when they fire at the same instant. vektor-sync's tasklet is a handful of bulk
  # HTTP calls (login + two fetches + a replace), so it reliably finishes in well under 5 minutes, guaranteeing
  # pickupMatchStep always sees this cycle's fresh driver data rather than racing it.
  cron: ${SHIPMENT_SYNC_CRON:0 5,25,45 * ? * *}

spring:
  application:
    name: sw-expedited
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD:}
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB_SWE:}
    username: ${SPRING_DATASOURCE_USERNAME:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

vektor:
  username: ${VEKTOR_USERNAME:}
  password: ${VEKTOR_PASSWORD:}
  company-id: ${VEKTOR_COMPANY_ID:}
  base-url: ${VEKTOR_BASE_URL:https://app.vektortms.com}
  retry-backoff: ${VEKTOR_RETRY_BACKOFF:5s}
  synced-statuses: ${VEKTOR_SYNCED_STATUSES:manifest_planning,manifest_assigned,manifest_dispatched,manifest_in_progress,manifest_delivered,manifest_tonu}
  sync-window-days-back: ${VEKTOR_SYNC_WINDOW_DAYS_BACK:14}
  sync-window-days-ahead: ${VEKTOR_SYNC_WINDOW_DAYS_AHEAD:60}

vektor-fleet-sync:
  # Offset 10 minutes from vektor-sync's own */20 tick (0,20,40) - the shared batchTaskExecutor pool
  # (ShipmentSyncJobConfig#batchTaskExecutor) is only 2 threads wide across every scheduled job in this app, so
  # staggering avoids contention rather than racing correctness - there's no ordering requirement between this job
  # and vektor-sync's own tick, VektorSyncTasklet's matching just uses whatever this job last synced.
  cron: ${VEKTOR_FLEET_SYNC_CRON:0 10,30,50 * ? * *}

vektor-sync:
  cron: ${VEKTOR_SYNC_CRON:0 */20 * ? * *}