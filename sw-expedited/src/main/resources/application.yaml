auth:
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  issuer: ${AUTH_ISSUER:auth-lava}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

gfm:
  key-store: file:${GFM_KEYSTORE_PATH:}
  key-store-password: ${GFM_KEYSTORE_PASSWORD:}
  trust-store: file:${GFM_TRUSTSTORE_PATH:}
  trust-store-password: ${GFM_TRUSTSTORE_PASSWORD:}
  client-id: ${GFM_CLIENT_ID:jKtlgBlmtxDtjDf6uMwJ08tVU6Za}
  eta-teams-base-url: ${GFM_ETA_TEAMS_BASE_URL:https://eta-teams.transport.mil}
  mps-kmis-base-url: ${GFM_MPS_KMIS_BASE_URL:https://mps-kmis.transport.mil}
  gfm-base-url: ${GFM_GFM_BASE_URL:https://gfm.transport.mil}
  retry-backoff: ${GFM_RETRY_BACKOFF:5s}
  detail-fetch-skip-limit: ${GFM_DETAIL_FETCH_SKIP_LIMIT:1000}

logging:
  level:
    com.lava: ${LOG_LEVEL_COM_LAVA:info}
    org.jooq.tools.LoggerListener: ${LOG_LEVEL_JOOQ:warn}
    org.springframework: ${LOG_LEVEL_SPRING:warn}
    org.springframework.jndi: error
    root: ${LOG_LEVEL_ROOT:info}
  pattern:
    console: "%d{yyyy-MM-dd} %d{HH:mm:ss.SSS} | %clr(%.-1p) | %-30.30logger{30} | %X{traceId:-} %X{spanId:-} | %clr(%replace(%m){'[\n\r\t]', '_'}%n)"
  # Unset (local dev) keeps the human-readable pattern above; set to gelf/ecs/logstash in
  # containerized/prod environments to emit structured JSON to stdout instead - MDC entries
  # (including traceId/spanId) are automatically included as JSON fields in every structured format.
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:}

management:
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8081}

samsara:
  api-token: ${SAMSARA_API_TOKEN:}
  base-url: ${SAMSARA_BASE_URL:https://api.samsara.com}
  retry-backoff: ${SAMSARA_RETRY_BACKOFF:5s}

samsara-driver-duty-status-sync:
  cron: ${SAMSARA_DRIVER_DUTY_STATUS_SYNC_CRON:0 * * ? * *}

samsara-driver-sync:
  cron: ${SAMSARA_DRIVER_SYNC_CRON:0 */5 * ? * *}

samsara-location-sync:
  cron: ${SAMSARA_LOCATION_SYNC_CRON:0 * * ? * *}

shipment-sync:
  cron: ${SHIPMENT_SYNC_CRON:0 */20 * ? * *}

spring:
  application:
    name: sw-expedited
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD:}
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:sw_expedited_db}
    username: ${SPRING_DATASOURCE_USERNAME:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

vektor:
  username: ${VEKTOR_USERNAME:}
  password: ${VEKTOR_PASSWORD:}
  company-id: ${VEKTOR_COMPANY_ID:}
  base-url: ${VEKTOR_BASE_URL:https://app.vektortms.com}
  retry-backoff: ${VEKTOR_RETRY_BACKOFF:5s}
  synced-statuses: ${VEKTOR_SYNCED_STATUSES:manifest_in_progress}

vektor-sync:
  cron: ${VEKTOR_SYNC_CRON:0 */2 * ? * *}