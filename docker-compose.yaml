services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    
  postgres:
    image: postgres:latest
    container_name: auth_postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  # Trace storage/query backend, fed OTLP directly by otel-collector below.
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: -config.file=/etc/tempo.yaml
    ports:
      # Tempo's query API, for direct debugging. The OTLP receiver ports (4317/4318) are intentionally not
      # published to the host - they're only reached by otel-collector over the compose network, and publishing
      # them would clash with otel-collector's own host-published 4317/4318 below.
      - "3200:3200"
    restart: unless-stopped
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo

  # Log/trace/metric collection point. backend/ and sw-expedited/ run outside Docker (via ./mvnw spring-boot:run),
  # so they push OTLP directly here over the host-published 4317/4318 ports rather than being collected from
  # container stdout. Fans out to loki (logs), tempo (traces), and prometheus (metrics) - see
  # docker/otel-collector/config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  # Log storage/query backend, fed OTLP directly by otel-collector above.
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      # Local dev only - anonymous admin access, same low-friction posture as the rest of this dev stack.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  mailpit_data:
  pgdata:
  loki_data:
  grafana_data:
  tempo_data:
  prometheus_data: