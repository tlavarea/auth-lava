auth:
  throttle:
    login-max-attempts: 5
    login-lockout-duration: 15m
    mfa-max-attempts: 5
    mfa-lockout-duration: 15m
    password-change-max-attempts: 5
    password-change-lockout-duration: 15m

cors:
  allowed-origins: http://localhost:4200

email-change:
  code-length: 6
  code-ttl: 5m
  max-attempts: 5
  resend-cooldown: 60s

logging:
  level:
    com.lava: info
    org.jooq.tools.LoggerListener: warn
    org.springframework: warn
    root: warn

jwt:
  private-key: 
  public-key: 
  key-id: auth-lava-test-key-1
  issuer: auth-lava-test
  access-token-ttl: 15m
  refresh-token-ttl: 30d

mfa:
  encryption-key: test-mfa-encryption-key
  encryption-salt: 5a1e2b3c4d5e6f708192a3b4c5d6e7f8
  backup-code-count: 10
  backup-code-length: 10
  totp-issuer: auth-lava-test
  totp-allowed-discrepancy: 1

mail:
  from-address: no-reply@auth-lava.local

oauth:
  success-redirect-uri: http://localhost:4200/
  failure-redirect-uri: http://localhost:4200/login?error=oauth

password-breach-check:
  enabled: false

registration:
  code-length: 6
  code-ttl: 5m
  max-attempts: 5
  resend-cooldown: 60s
  bridge-token-ttl: 5m

spring:
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,email,profile
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: read:user,user:email
