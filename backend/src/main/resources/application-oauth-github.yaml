# Activate with the `oauth-github` profile. See application.yaml for why providers live in
# profile files rather than being declared unconditionally.
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email
