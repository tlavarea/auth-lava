auth:
  throttle:
    login-max-attempts: ${AUTH_THROTTLE_LOGIN_MAX_ATTEMPTS:5}
    login-lockout-duration: ${AUTH_THROTTLE_LOGIN_LOCKOUT_DURATION:15m}
    mfa-max-attempts: ${AUTH_THROTTLE_MFA_MAX_ATTEMPTS:5}
    mfa-lockout-duration: ${AUTH_THROTTLE_MFA_LOCKOUT_DURATION:15m}
    password-change-max-attempts: ${AUTH_THROTTLE_PASSWORD_CHANGE_MAX_ATTEMPTS:5}
    password-change-lockout-duration: ${AUTH_THROTTLE_PASSWORD_CHANGE_LOCKOUT_DURATION:15m}

cookie:
  domain: ${COOKIE_DOMAIN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

email-change:
  code-length: ${EMAIL_CHANGE_CODE_LENGTH:6}
  code-ttl: ${EMAIL_CHANGE_CODE_TTL:5m}
  max-attempts: ${EMAIL_CHANGE_MAX_ATTEMPTS:5}
  resend-cooldown: ${EMAIL_CHANGE_RESEND_COOLDOWN:60s}

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:auth-lava}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

logging:
  level:
    com.lava: ${LOG_LEVEL_COM_LAVA:info}
    org.jooq.tools.LoggerListener: ${LOG_LEVEL_JOOQ:warn}
    org.springframework: ${LOG_LEVEL_SPRING:warn}
    org.springframework.jndi: error
    root: ${LOG_LEVEL_ROOT:info}
  pattern:
    console: "%d{yyyy-MM-dd} %d{HH:mm:ss.SSS} | %clr(%.-1p) | %-30.30logger{30} | %X{traceId:-} %X{spanId:-} | %clr(%replace(%m){'[\n\r\t]', '_'}%n)"
  # Unset (local dev) keeps the human-readable pattern above; set to gelf/ecs/logstash in
  # containerized/prod environments to emit structured JSON to stdout instead - MDC entries
  # (including traceId/spanId) are automatically included as JSON fields in every structured format.
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:}

mail:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@auth-lava.local}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY:}
  encryption-salt: ${MFA_ENCRYPTION_SALT:}
  backup-code-count: ${MFA_BACKUP_CODE_COUNT:10}
  backup-code-length: ${MFA_BACKUP_CODE_LENGTH:10}
  totp-issuer: ${MFA_TOTP_ISSUER:auth-lava}
  totp-allowed-discrepancy: ${MFA_TOTP_ALLOWED_DISCREPANCY:1}

oauth:
  success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:4200/}
  failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:4200/login?error=oauth}

password-breach-check:
  enabled: ${PASSWORD_BREACH_CHECK_ENABLED:true}

registration:
  code-length: ${REGISTRATION_CODE_LENGTH:6}
  code-ttl: ${REGISTRATION_CODE_TTL:5m}
  max-attempts: ${REGISTRATION_MAX_ATTEMPTS:5}
  resend-cooldown: ${REGISTRATION_RESEND_COOLDOWN:60s}
  bridge-token-ttl: ${REGISTRATION_BRIDGE_TOKEN_TTL:5m}

spring:
  application:
    name: auth-lava
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:2s}
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD:}
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:}
    username: ${SPRING_DATASOURCE_USERNAME:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp.auth: ${SMTP_AUTH:false}
    properties.mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email