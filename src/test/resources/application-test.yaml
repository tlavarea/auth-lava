cors:
  allowed-origins: http://localhost:4200

logging:
  level:
    com.lava: info
    org.jooq.tools.LoggerListener: warn
    org.springframework: warn
    root: warn

jwt:
  secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
  issuer: auth-lava-test
  access-token-ttl: 15m
  refresh-token-ttl: 30d

mfa:
  encryption-key: test-mfa-encryption-key
  encryption-salt: 5a1e2b3c4d5e6f708192a3b4c5d6e7f8
  backup-code-count: 10
  backup-code-length: 10
  totp-issuer: auth-lava-test
  totp-allowed-discrepancy: 1

oauth:
  success-redirect-uri: http://localhost:4200/
  failure-redirect-uri: http://localhost:4200/login?error=oauth

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,email,profile
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: read:user,user:email
